<!DOCTYPE html>
<head>
  <title>Pokemon Team Builder</title>
  <style>
    body {
      font-family: serif;
      background-color: #a8d8ea;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
      min-height: 100vh;
    }

    .main-card {
      background: white;
      border: 3px solid #d4a017;
      border-radius: 20px;
      padding: 24px 28px 28px;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }


    .main-card h2 {
      font-size: 16px;
      font-weight: normal; 
      margin-bottom: 8px;
    }

    .search-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-bottom: 16px;
    }

    /*text box*/
    .search-row input {
      width: 220px;
      padding: 4px 6px;
      font-size: 14px;
      font-family: serif;
      border: 1px solid #999;
    }

    /*find button*/
    .search-row button {
      padding: 4px 12px;
      font-size: 14px;
      font-family: serif;
      cursor: pointer;
    }

    /*image in box*/
    #sprite-container {
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    #sprite-container img {
      image-rendering: pixelated;
      width: 140px;
      height: 140px;
      object-fit: contain;
    }

    /*audio*/
    #pokemon-audio {
      width: 100%;
      max-width: 340px;
      margin-bottom: 12px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /*moves*/
    .moves-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .moves-grid select {
      padding: 4px 6px;
      font-size: 13px;
      font-family: serif;
      border: 1px solid #999;
      cursor: pointer;
    }

    /*add to team*/
    #add-btn {
      padding: 5px 16px;
      font-size: 14px;
      font-family: serif;
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }

    /*not found message*/
    #status-msg {
      font-size: 13px;
      color: red;
      margin-bottom: 6px;
      min-height: 18px;
    }

    /*team table*/
    #team-table {
      width: 100%;
      max-width: 480px;
      border-collapse: collapse;
      margin-top: 0;
      background: white;
      border: 1px solid #ccc;
    }

    /*row borders*/
    #team-table tr {
      border-bottom: 1px solid #ccc;
    }
    #team-table tr:last-child {
      border-bottom: none;
    }

    .team-sprite-cell {
      width: 80px;
      text-align: center;
      padding: 8px;
      border-right: 1px solid #ccc;
      vertical-align: middle;
    }

    .team-sprite-cell img {
      image-rendering: pixelated;
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    .team-moves-cell {
      padding: 8px 16px;
      vertical-align: middle;
      text-align: left;
    }

    .team-moves-cell ul {
      list-style: disc;
      padding-left: 20px;
      margin: 0;
    }

    .team-moves-cell ul li {
      font-size: 14px;
      font-family: serif;
      line-height: 1.6;
      text-transform: capitalize;
    }

    /*hide elements until needed*/
    .hidden { display: none !important; }
  </style>
</head>

<body>

<div class="main-card">
  <h2>Name or ID</h2>

  <div class="search-row">
    <input type="text" id="pokemon-input" />
    <button id="find-btn">Find</button>
  </div>

  <div id="sprite-container"></div>

  <!--error message-->
  <div id="status-msg"></div>

  <!--audio-->
  <audio id="pokemon-audio" controls class="hidden"></audio>

  <!--4 move dropdowns-->
  <div class="moves-grid hidden" id="moves-section">
    <select id="move1"></select>
    <select id="move2"></select>
    <select id="move3"></select>
    <select id="move4"></select>
  </div>

  <!--add to Team button-->
  <button id="add-btn" class="hidden">Add to Team</button>

</div>

<!--team table at the bottom-->
<table id="team-table" class="hidden">
  <tbody id="team-tbody"></tbody>
</table>


<!--java script part-->
<script>
  //cache part
  const cache = {};

  //html references
  const input           = document.getElementById('pokemon-input');
  const findBtn         = document.getElementById('find-btn');
  const spriteContainer = document.getElementById('sprite-container');
  const statusMsg       = document.getElementById('status-msg');
  const pokemonAudio    = document.getElementById('pokemon-audio');
  const movesSection    = document.getElementById('moves-section');
  const addBtn          = document.getElementById('add-btn');
  const teamTable       = document.getElementById('team-table');
  const teamTbody       = document.getElementById('team-tbody');

  //four move dropdowns grouped in an array
  const moveSelects = [
    document.getElementById('move1'),
    document.getElementById('move2'),
    document.getElementById('move3'),
    document.getElementById('move4'),
  ];

  //store the most recently fetched Pokemon's data
  let currentPokemon = null;

  //clicking "Find" runs fetchPokemon()
  findBtn.addEventListener('click', fetchPokemon);

  //pressing enter in the text box also runs fetchPokemon()
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') fetchPokemon();
  });

  //clicking "Add to Team" runs addToTeam()
  addBtn.addEventListener('click', addToTeam);


  //fetch the pokemon
  async function fetchPokemon() {

    //read and clean the user's input
    const query = input.value.trim().toLowerCase();
    //do nothing if the box is empty
    if (!query) return;

    //reset for next input
    statusMsg.textContent = 'Loading...';
    spriteContainer.innerHTML = '';
    pokemonAudio.classList.add('hidden');
    movesSection.classList.add('hidden');
    addBtn.classList.add('hidden');

    try {
      let data;

      //cache check
      if (cache[query]) {
        data = cache[query];
      } else {
        //fetch() sends an HTTP GET request to the PokeAPI
        const response = await fetch('https://pokeapi.co/api/v2/pokemon/' + query);

        //if the server says "not found", throw an error to jump to catch{}
        if (!response.ok) throw new Error('Not found');

        //parse the JSON response body
        data = await response.json();

        //save to cache for future searches
        cache[query] = data;
      }

      //store as the active Pokemon (needed when user clicks Add to Team)
      currentPokemon = data;
      statusMsg.textContent = '';

      //show the pokemon
      const spriteUrl = data.sprites?.front_default;
      if (spriteUrl) {
        const img = document.createElement('img');
        img.src = spriteUrl;
        img.alt = data.name;
        spriteContainer.appendChild(img);
      }

      //show the audio
      const cryUrl = data.cries?.latest || data.cries?.legacy;
      if (cryUrl) {
        pokemonAudio.src = cryUrl;
        pokemonAudio.classList.remove('hidden');
      }

      //fill out the moves dropdown
      const moveNames = data.moves.map(function(m) { return m.move.name; });

      moveSelects.forEach(function(select) {
        // clear options from any previous search
        select.innerHTML = ''; 

        moveNames.forEach(function(name) {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          select.appendChild(opt);
        });
      });

      //show the dropdowns and add to team button
      movesSection.classList.remove('hidden');
      addBtn.classList.remove('hidden');

    } catch (err) {
      //error if no pokemon found
      statusMsg.textContent = 'Pokemon not found!';
      spriteContainer.innerHTML = '';
    }
  }


  //add to our team
  function addToTeam() {
    //no pokemon searched
    if (!currentPokemon) return;

    //collect the currently selected move name from each dropdown
    const selectedMoves = moveSelects.map(function(s) { return s.value; });

    const spriteUrl = currentPokemon.sprites?.front_default || '';
    const name = currentPokemon.name;

    //new row for each pokemon
    //photo and name
    const spriteCell = document.createElement('td');
    spriteCell.className = 'team-sprite-cell';
    const img = document.createElement('img');
    img.src = spriteUrl;
    img.alt = name;
    spriteCell.appendChild(img);

    //moves selected
    const movesCell = document.createElement('td');
    movesCell.className = 'team-moves-cell';
    const ul = document.createElement('ul');

    selectedMoves.forEach(function(moveName) {
      const li = document.createElement('li');
      li.textContent = moveName;
      ul.appendChild(li);
    });

    movesCell.appendChild(ul);

    //add row
    const row = document.createElement('tr');
    row.appendChild(spriteCell);
    row.appendChild(movesCell);
    teamTbody.appendChild(row);

    //show the table
    teamTable.classList.remove('hidden');
  }

</script>
</body>
</html>
